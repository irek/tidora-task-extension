<!doctype html>
<html lang="pl">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="task-form.css" />
</head>
<body>
	<div class="wrap">
		<h1><span class="dot"></span> <span data-i18n="taskFormHeading"></span></h1>
		<form id="form">
			<label for="title" data-i18n="fieldTitle"></label>
			<input id="title" type="text" required maxlength="255" />

			<label for="description" data-i18n="fieldDescription"></label>
			<div id="description" class="rich-input" contenteditable="true" data-i18n-dataplaceholder="descriptionPlaceholder"></div>

			<a id="url" class="url-line" target="_blank" rel="noopener"></a>

			<div id="contractor-field" style="display:none">
				<label for="contractor" data-i18n="fieldClient"></label>
				<select id="contractor">
					<option value="" data-i18n="noClientOption"></option>
				</select>
			</div>

			<div class="row">
				<button type="submit" id="submit" class="btn-primary" data-i18n="submitCreateTask"></button>
			</div>
			<div id="status" class="status"></div>
		</form>
		<div class="footer"><a href="#" id="open-options" data-i18n="footerSettingsLink"></a></div>
	</div>
	<script src="i18n.js"></script>
	<script src="task-form.js"></script>
	<script src="popup.js"></script>
</body>
</html>
